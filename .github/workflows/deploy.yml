name: Deploy to Cloudflare

# Run from the Actions tab ("Run workflow"), or automatically on pushes to main.
# Needs four repository secrets (two for Cloudflare, the LegendKeeper API key
# and the extension's access password); see README → Deploy.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check LegendKeeper secrets
        env:
          LK_API_KEYS: ${{ secrets.LK_API_KEYS }}
          LK_API_KEY: ${{ secrets.LK_API_KEY }}
          LKOB_ACCESS_TOKENS: ${{ secrets.LKOB_ACCESS_TOKENS }}
        run: node deploy/secrets.mjs "$RUNNER_TEMP/worker-secrets.json"

      - name: Prepare Cloudflare (subdomain check, token storage)
        id: prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy/prepare.mjs

      - run: npm run build:cloudflare

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The secrets go up with the code, so no version ever runs without them.
        run: |
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"
          rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Check the deployment
        id: check
        run: |
          base="https://lk-to-owlbear.${{ steps.prepare.outputs.subdomain }}.workers.dev"
          for i in $(seq 1 20); do
            if curl -fsS "$base/api/health" > /dev/null && curl -fsS "$base/manifest.json" > /dev/null; then break; fi
            sleep 3
          done
          curl -fsS "$base/api/health"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          {
            echo "## Deployed"
            echo ""
            echo "In Owlbear Rodeo, open your profile, click **Add Extension** and paste:"
            echo ""
            echo '```'
            echo "$base/manifest.json"
            echo '```'
            echo ""
            echo "Enable it for a room, open it from the room's top-left toolbar and enter your LKOB_ACCESS_TOKENS password."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the page lists
        env:
          WORKER_URL: ${{ steps.check.outputs.base }}
          LKOB_ACCESS_TOKENS: ${{ secrets.LKOB_ACCESS_TOKENS }}
        run: node deploy/page-list.mjs | tee -a "$GITHUB_STEP_SUMMARY"
