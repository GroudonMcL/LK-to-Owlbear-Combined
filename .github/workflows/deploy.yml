name: Deploy to Cloudflare

# Run from the Actions tab ("Run workflow"), or automatically on pushes to main.
# Needs two repository secrets (Cloudflare); see README → Deploy. The
# LegendKeeper API key is not a secret here: it is pasted into the extension.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Prepare Cloudflare (subdomain check, token storage)
        id: prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node deploy/prepare.mjs

      - run: npm run build:cloudflare

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Check the deployment
        run: |
          base="https://lk-to-owlbear.${{ steps.prepare.outputs.subdomain }}.workers.dev"
          for i in $(seq 1 20); do
            if curl -fsS "$base/api/health" > /dev/null && curl -fsS "$base/manifest.json" > /dev/null; then break; fi
            sleep 3
          done
          curl -fsS "$base/api/health"
          {
            echo "## Deployed"
            echo ""
            echo "In Owlbear Rodeo, open your profile, click **Add Extension** and paste:"
            echo ""
            echo '```'
            echo "$base/manifest.json"
            echo '```'
            echo ""
            echo "Enable it for a room, open it from the room's top-left toolbar and paste your LegendKeeper API key into Settings."
          } >> "$GITHUB_STEP_SUMMARY"
